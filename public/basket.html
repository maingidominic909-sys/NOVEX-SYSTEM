<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Supply basket — Norvex order desk</title>
<meta name="description" content="Review your supply lines, watch tier pricing nudges and proceed to checkout.">
<link rel="icon" href="/img/mark.png">
<link rel="stylesheet" href="/css/nv.css?v=9">
</head>
<body data-page="basket">
<div id="nv-shell-top"></div>

<main id="main">
  <section class="section tight">
    <div class="shell">
      <div class="section-head" style="margin-bottom:22px">
        <div>
          <p class="eyebrow">Order desk</p>
          <h1 class="h-display">Supply basket</h1>
          <p class="lede">Quantities cross price tiers live — the nudges show exactly how many more units unlock the next break.</p>
        </div>
        <a class="btn btn-ghost" href="/desk.html">Back to order desk</a>
      </div>
      <div id="basketEmpty" class="hide"></div>
      <div id="basketRoot" class="basket-layout hide">
        <div class="card" id="basketLines"></div>
        <div id="basketSummary"></div>
      </div>
    </div>
  </section>
</main>

<div id="nv-shell-bottom"></div>

<script src="/js/catalog-snapshot.js?v=9"></script>
<script src="/js/nv-core.js?v=9"></script>
<script src="/js/nv-auth.js?v=9"></script>
<script src="/js/ui.js?v=9"></script>

<script src="/js/pages/basket.js?v=9"></script>
