<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Request a quotation — Norvex</title>
<meta name="description" content="Build a multi-line requisition and get a formal quotation with tier pricing within one business day.">
<link rel="icon" href="/img/mark.png">
<script>(function(){try{if(localStorage.getItem('norvex.theme.v1')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="/css/nv.css?v=16">
</head>
<body data-page="quote">
<div id="nv-shell-top"></div>

<main id="main">
  <section class="page-hero">
    <div class="bg" style="background-image:url('/img/contact-hero.jpg')"></div>
    <div class="scrim"></div>
    <div class="shell">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg><b>Quote desk</b></nav>
      <h1>Request a formal quotation</h1>
      <p class="lede">Tenders, contract supply and bulk requisitions — build the lines, see an indicative estimate, and our desk replies within one business day.</p>
    </div>
  </section>

  <section class="section tight">
    <div class="shell" id="quoteMain">
      <div class="builder-layout">
        <div class="col" style="gap:22px">
          <div class="card">
            <div class="card-head"><h3>Requisition lines</h3><button class="btn btn-soft btn-sm" id="addLine" type="button">+ Add line</button></div>
            <div class="card-body" id="quoteLines"></div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Who should we quote?</h3></div>
            <div class="card-body">
              <form class="form-grid" id="quoteContact" novalidate>
                <div class="field"><label>Contact name <span class="req">*</span></label><input class="input" name="name" autocomplete="name" placeholder="Grace Wanjiru"><span class="err-msg">Required.</span></div>
                <div class="field"><label>Organisation <span class="req">*</span></label><input class="input" name="organisation" placeholder="School, hospital, county…"><span class="err-msg">Required.</span></div>
                <div class="field"><label>Email <span class="req">*</span></label><input class="input" name="email" type="email" placeholder="procurement@organisation.co.ke"><span class="err-msg">Enter a valid email.</span></div>
                <div class="field"><label>Phone <span class="req">*</span></label><input class="input" name="phone" type="tel" placeholder="0712 345 678"><span class="err-msg">Enter a valid phone.</span></div>
                <div class="field full"><label>Notes for the desk</label><textarea class="textarea" name="notes" placeholder="Tender number, required brands, delivery schedule, LPO details…"></textarea></div>
              </form>
            </div>
          </div>
        </div>
        <div id="quoteSummary"></div>
      </div>
    </div>
  </section>
</main>

<div id="nv-shell-bottom"></div>

<script src="/js/catalog-snapshot.js?v=16"></script>
<script src="/js/nv-core.js?v=16"></script>
<script src="/js/nv-auth.js?v=16"></script>
<script src="/js/ui.js?v=16"></script>
<script src="/js/shell.js?v=16"></script>
<script src="/js/pages/quote.js?v=16"></script>
</body>
</html>
