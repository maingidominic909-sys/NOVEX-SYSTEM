<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Catalogue — Norvex Integrated Enterprises Ltd</title>
<meta name="description" content="Browse 45+ supply lines across 13 departments with live volume pricing, MOQ and dispatch lead times.">
<link rel="icon" href="/img/mark.png">
<link rel="stylesheet" href="/css/nv.css?v=10">
</head>
<body data-page="shop">
<div id="nv-shell-top"></div>

<main id="main">
  <section class="page-hero">
    <div class="bg" style="background-image:url('/img/products/maize.jpg')"></div>
    <div class="scrim"></div>
    <div class="shell">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg><b>Catalogue</b></nav>
      <h1 id="shopTitle">Full catalogue</h1>
      <p class="lede">Every line carries a pack unit, minimum order and 3-step volume pricing. Filter, search and build your supply basket.</p>
    </div>
  </section>

  <section class="section tight" id="shopTop">
    <div class="shell">
      <div class="shop-toolbar">
        <button class="btn btn-ghost btn-sm filters-toggle" id="filtersToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg> Filters
        </button>
        <div class="input-wrap search-in">
          <span class="lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <input class="input" id="shopSearch" type="text" placeholder="Search the catalogue…" aria-label="Search the catalogue">
        </div>
        <span class="shop-count" id="shopCount"></span>
        <select class="select" id="shopSort" style="width:auto" aria-label="Sort products">
          <option value="popular">Most popular</option>
          <option value="price-asc">Price · low to high</option>
          <option value="price-desc">Price · high to low</option>
          <option value="name">Name · A to Z</option>
        </select>
      </div>
      <div class="active-chips" id="activeChips"></div>
      <div class="shop-layout">
        <aside class="shop-side" id="shopSide" aria-label="Catalogue filters"></aside>
        <div>
          <div class="pgrid" id="shopGrid"></div>
          <div class="pager" id="shopPager"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="nv-shell-bottom"></div>

<script src="/js/catalog-snapshot.js?v=10"></script>
<script src="/js/nv-core.js?v=10"></script>
<script src="/js/nv-auth.js?v=10"></script>
<script src="/js/ui.js?v=10"></script>
<script src="/js/shell.js?v=10"></script>
<script src="/js/pages/shop.js?v=10"></script>
</body>
</html>
