<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Order desk — Norvex</title>
<meta name="description" content="Your supply command centre: basket, open orders, quick actions and popular lines.">
<link rel="icon" href="/img/mark.png">
<script>(function(){try{if(localStorage.getItem('norvex.theme.v1')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="/css/nv.css?v=17">
</head>
<body data-page="desk">
<div id="nv-shell-top"></div>

<main id="main">
  <section class="section tight">
    <div class="shell">
      <div class="desk-hero">
        <p class="eyebrow" style="color:var(--gold-400)">Order desk</p>
        <h1 id="deskHello">Your order desk.</h1>
        <p id="deskSub"></p>
        <div class="cta-actions" id="deskAuthCta"></div>
      </div>

      <div class="kpi-grid desk-stats" id="deskKpis"></div>

      <div class="desk-quick-head">
        <h2>Quick actions</h2>
      </div>
      <div class="quick-grid" id="deskQuick"></div>

      <div class="card mb-3">
        <div class="card-head"><h3>Recent orders</h3><a class="btn btn-ghost btn-sm" href="/orders.html">Full history</a></div>
        <div id="deskRecent"></div>
      </div>

      <div class="section-head" style="margin-bottom:16px">
        <div>
          <p class="eyebrow">Fast re-order</p>
          <h2 class="h-section" style="font-size:1.3rem">Popular lines right now</h2>
        </div>
        <a class="link-arrow" href="/shop.html?sort=popular">See all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg></a>
      </div>
      <div class="pgrid" id="deskPopular"></div>
    </div>
  </section>
</main>

<div id="nv-shell-bottom"></div>

<script src="/js/catalog-snapshot.js?v=17"></script>
<script src="/js/nv-core.js?v=17"></script>
<script src="/js/nv-auth.js?v=17"></script>
<script src="/js/ui.js?v=17"></script>
<script src="/js/shell.js?v=17"></script>
<script src="/js/pages/desk.js?v=17"></script>
</body>
</html>
