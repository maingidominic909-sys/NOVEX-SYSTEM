<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue item — Norvex Integrated Enterprises Ltd</title>
<meta name="description" content="Product detail, volume pricing, MOQ and delivery lead time from the Norvex catalogue.">
<link rel="icon" href="/img/mark.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/portal.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="portal" data-page="shop">
<div id="nv-header"></div>

<main>
  <div class="shell" style="padding-top:26px">
    <nav class="breadcrumb" id="crumbs" style="color:var(--muted)">
      <a href="/index.html">Home</a><span class="sep">/</span><a href="/shop.html">Catalogue</a>
    </nav>
  </div>

  <section class="section-tight" style="padding-top:14px">
    <div class="shell">
      <div class="pdp" id="pdp">
        <div class="pdp-media"><div class="skeleton" style="width:100%;height:100%"></div></div>
        <div class="skeleton" style="height:420px;border-radius:var(--radius)"></div>
      </div>
    </div>
  </section>

  <section class="section-tight section-cream">
    <div class="shell">
      <div class="tabs" role="tablist">
        <button class="on" data-tab="overview">Overview</button>
        <button data-tab="spec">Specification &amp; delivery</button>
        <button data-tab="procurement">Procurement notes</button>
      </div>
      <div id="tabBody" style="max-width:78ch"></div>
    </div>
  </section>

  <section class="section">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="eyebrow">Often ordered together</p>
          <h2>Complete the requisition.</h2>
        </div>
        <a href="/shop.html" class="link-arrow">Back to catalogue</a>
      </div>
      <div class="product-grid" id="related"></div>
    </div>
  </section>
</main>

<div id="nv-footer"></div>

<script src="/js/catalog-snapshot.js"></script>
<script src="/js/nv-core.js"></script>
<script src="/js/nv-ui.js"></script>
<script src="/js/nv-payments.js"></script>
<script src="/js/nv-cookies.js"></script>
<script src="/js/chrome-portal.js"></script>
<script src="/js/page-product.js"></script>
</body>
</html>
